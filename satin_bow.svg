<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" width="400" height="160">
  <defs>
    <!-- Satin Pink Ribbon Gradients -->
    <linearGradient id="bowGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7fa6" />
      <stop offset="45%" stop-color="#ff5989" />
      <stop offset="70%" stop-color="#ff336e" />
      <stop offset="100%" stop-color="#e61a55" />
    </linearGradient>

    <linearGradient id="bowGradHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb3cb" />
      <stop offset="30%" stop-color="#ff8dae" />
      <stop offset="100%" stop-color="#ff477c" />
    </linearGradient>

    <linearGradient id="bowGradShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d6154e" />
      <stop offset="100%" stop-color="#8c072f" />
    </linearGradient>

    <filter id="bowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#ff2e6d" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#bowGlow)">
    <!-- Left Ribbon Streamer (flowing down left) -->
    <path d="M 180,85 C 130,95 70,125 30,155 C 55,145 80,140 100,150 C 130,125 170,100 190,95 Z" 
          fill="url(#bowGradShadow)" opacity="0.9" />
    <path d="M 185,82 C 140,90 80,120 40,150 C 65,138 90,135 110,145 C 140,118 175,95 195,90 Z" 
          fill="url(#bowGradMain)" />

    <!-- Right Ribbon Streamer (flowing down right) -->
    <path d="M 220,85 C 270,95 330,125 370,155 C 345,145 320,140 300,150 C 270,125 230,100 210,95 Z" 
          fill="url(#bowGradShadow)" opacity="0.9" />
    <path d="M 215,82 C 260,90 320,120 360,150 C 335,138 310,135 290,145 C 260,118 225,95 205,90 Z" 
          fill="url(#bowGradMain)" />

    <!-- Left Outer Loop -->
    <path d="M 190,75 C 150,30 90,20 60,45 C 35,68 45,105 85,115 C 130,125 175,95 190,80 Z" 
          fill="url(#bowGradShadow)" />
    <!-- Left Inner Loop / Face -->
    <path d="M 188,72 C 152,35 98,28 70,50 C 48,70 56,100 92,108 C 132,118 172,90 188,76 Z" 
          fill="url(#bowGradHighlight)" stroke="#ff2e6d" stroke-width="1.5" />
    <!-- Left Loop Highlight Fold -->
    <path d="M 185,74 C 150,55 110,48 85,62 C 120,70 160,78 185,76 Z" 
          fill="#ffd1e0" opacity="0.75" />

    <!-- Right Outer Loop -->
    <path d="M 210,75 C 250,30 310,20 340,45 C 365,68 355,105 315,115 C 270,125 225,95 210,80 Z" 
          fill="url(#bowGradShadow)" />
    <!-- Right Inner Loop / Face -->
    <path d="M 212,72 C 248,35 302,28 330,50 C 352,70 344,100 308,108 C 268,118 228,90 212,76 Z" 
          fill="url(#bowGradHighlight)" stroke="#ff2e6d" stroke-width="1.5" />
    <!-- Right Loop Highlight Fold -->
    <path d="M 215,74 C 250,55 290,48 315,62 C 280,70 240,78 215,76 Z" 
          fill="#ffd1e0" opacity="0.75" />

    <!-- Center Knot -->
    <ellipse cx="200" cy="76" rx="26" ry="24" fill="url(#bowGradShadow)" />
    <ellipse cx="200" cy="74" rx="24" ry="22" fill="url(#bowGradHighlight)" stroke="#ff2e6d" stroke-width="1.5" />
    <path d="M 184,66 C 192,60 208,60 216,66 C 210,74 190,74 184,66 Z" fill="#ffffff" opacity="0.7" />
    <!-- Center Knot Fold lines -->
    <path d="M 186,72 Q 200,82 214,72" stroke="#b3093b" stroke-width="1.8" fill="none" opacity="0.6" />
    <path d="M 189,80 Q 200,88 211,80" stroke="#b3093b" stroke-width="1.5" fill="none" opacity="0.5" />
  </g>
</svg>
